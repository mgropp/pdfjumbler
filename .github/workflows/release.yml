name: Release

on:
  push:
    tags:
      - "v-[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build jar
        run: ./gradlew test jar -Pversion="${GITHUB_REF_NAME#v-}"

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install --yes nsis

      - name: Build Windows installer
        run: makensis pdfjumbler.nsi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/libs/pdfjumbler.jar
          build/setup-pdfjumbler.exe
          --title "PdfJumbler $GITHUB_REF_NAME"
          --generate-notes
