name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting, run tests and build the jar
        run: ./gradlew spotlessCheck test jar

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install --yes nsis

      - name: Build Windows installer
        run: makensis pdfjumbler.nsi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
